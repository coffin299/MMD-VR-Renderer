name: Release

on:
  push:
    tags:
      - "v*"
  # Actions → Release → Run workflow でタグ名を手入力して出せる
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (例: v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Pre-release として公開"
        required: false
        type: boolean
        default: false
      draft:
        description: "Draft（下書き）として作成"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}".Trim()
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is empty"
          }
          # Accept "0.2.0" or "v0.2.0"
          if ($tag -notmatch '^v') {
            $tag = "v$tag"
          }
          if ($tag -notmatch '^v[0-9]') {
            throw "Tag must look like v1.2.3 (got: $tag)"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "RELEASE_TAG=$tag"

      - name: Fetch third-party deps
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\fetch_deps.ps1
          # FFmpeg is optional for the plugin zip; keep release lean without ffmpeg.exe

      - name: Configure & build
        shell: pwsh
        run: |
          # Do not pin VS 2022: windows-latest (2025+) ships VS 2026 only.
          # Let CMake pick the newest installed Visual Studio generator.
          cmake -S . -B build -A x64
          cmake --build build --config Release --target d3d9 -- /m
          cmake --build build --config Release --target mmdvr_tests -- /m
          cmake --build build --config Release --target mmdvr_offline -- /m

      - name: Run unit tests
        shell: pwsh
        run: .\build\Release\mmdvr_tests.exe

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $stage = "dist\MMD-VR-Renderer-$tag"
          New-Item -ItemType Directory -Force -Path @(
            "$stage\bin",
            "$stage\tools",
            "$stage\docs"
          ) | Out-Null
          Copy-Item .\build\Release\d3d9_mmdvr.dll "$stage\bin\"
          Copy-Item .\build\Release\d3d9.dll "$stage\bin\" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$stage\bin\d3d9.dll")) {
            Copy-Item .\build\Release\d3d9_mmdvr.dll "$stage\bin\d3d9.dll"
          }
          Copy-Item .\build\Release\mmdvr_offline.exe "$stage\bin\" -ErrorAction SilentlyContinue
          @'
          #Requires -Version 5.1
          param(
            [Parameter(Mandatory=$false)]
            [string]$MmdDir = ""
          )
          $ErrorActionPreference = "Stop"
          if (-not $MmdDir) {
            $MmdDir = Read-Host "MMD folder path (directory containing MikuMikuDance.exe)"
          }
          $pkgRoot = Split-Path -Parent $PSScriptRoot
          $bin = Join-Path $pkgRoot "bin"
          & (Join-Path $PSScriptRoot "install_to_mmd_core.ps1") -MmdDir $MmdDir -BuildDir $bin
          '@ | Set-Content "$stage\tools\install_to_mmd.ps1" -Encoding UTF8
          Copy-Item .\tools\install_to_mmd.ps1 "$stage\tools\install_to_mmd_core.ps1"
          Copy-Item .\tools\uninstall_from_mmd.ps1 "$stage\tools\"
          Copy-Item .\docs\* "$stage\docs\"
          Copy-Item .\README.md, .\LICENSE, .\NOTICE, .\CHANGELOG.txt "$stage\" -ErrorAction SilentlyContinue
          $zip = "dist\MMD-VR-Renderer-$tag-win64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Get-Item $zip | Format-List FullName, Length

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build BOOTH installer
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          powershell -ExecutionPolicy Bypass -File .\tools\build_booth_installer.ps1
          Copy-Item .\dist\booth\MMD-VR-Renderer-Installer.exe `
            ".\dist\MMD-VR-Renderer-Installer-$tag.exe" -Force

      # softprops updates an existing Release for the same tag, but does not
      # move the git tag itself. Force-retarget so re-runs overwrite pre/full releases.
      - name: Retarget tag to this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag ${{ github.sha }}
          git push -f origin "refs/tags/$tag"
          Write-Host "Tag $tag -> ${{ github.sha }} (force)"

      - name: Create / overwrite GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MMD-VR-Renderer ${{ steps.meta.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || false }}
          # Full changelog lives in CHANGELOG.txt (not auto commit-diff notes).
          generate_release_notes: false
          # Same-name assets on an existing release (incl. pre-release) are replaced.
          overwrite_files: true
          files: |
            dist/MMD-VR-Renderer-${{ steps.meta.outputs.tag }}-win64.zip
            dist/MMD-VR-Renderer-Installer-${{ steps.meta.outputs.tag }}.exe
          body: |
            ## 配布物 / Artifacts
            - `MMD-VR-Renderer-${{ steps.meta.outputs.tag }}-win64.zip` — `d3d9.dll`（読込用）+ `d3d9_mmdvr.dll`（同内容・目印）、導入スクリプト、ドキュメント
            - `MMD-VR-Renderer-Installer-${{ steps.meta.outputs.tag }}.exe` — BOOTH 向け（最新 Release を取得して MMD へ導入・更新）

            ## 導入 / Install
            1. zip を展開
            2. `tools\install_to_mmd.ps1` を実行（MMD フォルダを指定）
            3. `MikuMikuDance.exe` を起動 → メニュー **VRレンダラー (VR Renderer)**

            または BOOTH インストーラー exe で MMD フォルダを指定 → **導入 / 更新**

            ## Full Changelog
            See [`CHANGELOG.txt`](https://github.com/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/CHANGELOG.txt) in this tag.

            ## 不具合報告 / Bug reports
            https://github.com/${{ github.repository }}/issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
